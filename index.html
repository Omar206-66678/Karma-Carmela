<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5132">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="كارمه كارميلا — نظام إدارة المخزن والمبيعات يعمل بدون إنترنت">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>كارمه كارميلا</title>
<script>try{var t=localStorage.getItem('kk-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style id="pageStyle"></style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="kkG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FA971"/><stop offset="1" stop-color="#0A3A25"/></linearGradient>
<linearGradient id="kkO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB45E"/><stop offset="1" stop-color="#FF7A00"/></linearGradient>
</defs></svg>
<div id="app"></div>
<div id="sheet"></div><div id="toast"></div><div id="printArea"></div>
<noscript><p style="padding:24px;text-align:center">يلزم تفعيل JavaScript لتشغيل التطبيق.</p></noscript>
<script>
/* تشخيص تلقائي: إن لم يظهر التطبيق خلال ثوانٍ يعرض الملفات الناقصة والخطأ بدل الشاشة السوداء */
(function () {
  var FILES = ['css/app.css', 'js/app.js', 'js/db.js', 'js/core.js', 'js/barcode.js', 'js/decoder.js', 'js/scanner.js', 'js/services.js', 'js/reports.js', 'js/ui.js', 'js/pages/dashboard.js', 'js/pages/products.js', 'js/pages/categories.js', 'js/pages/docs.js', 'js/pages/invoices.js', 'js/pages/parties.js', 'js/pages/cash.js', 'js/pages/reports.js', 'js/pages/settings.js', 'js/pages/more.js', 'manifest.webmanifest', 'icon.svg'];
  var lastErr = '';
  addEventListener('error', function (e) { lastErr = (e.message || 'خطأ') + (e.filename ? ' — ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : ''); });
  addEventListener('unhandledrejection', function (e) { lastErr = String((e.reason && e.reason.message) || e.reason); });
  window.kkReset = function () {
    var p = (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : Promise.resolve();
    p.then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0; }).then(function () { location.reload(); });
  };
  setTimeout(function () {
    var app = document.getElementById('app');
    if (!app || app.children.length) return;
    Promise.all(FILES.map(function (f) {
      return fetch(f, { cache: 'no-store' }).then(function (r) { return r.ok ? '' : f + ' (' + r.status + ')'; }).catch(function () { return f + ' (تعذّر التحميل)'; });
    })).then(function (m) {
      m = m.filter(Boolean);
      app.innerHTML = '<div style="padding:24px;color:#fff;background:#0B130F;min-height:100vh;font-family:system-ui,sans-serif;line-height:1.8">' +
        '<h2 style="margin:0 0 8px">تعذّر تشغيل التطبيق</h2>' +
        (m.length ? '<p>هذه الملفات ناقصة أو في مكان خاطئ على GitHub (يجب الحفاظ على الفولدرات كما هي):</p><ul id="kkm" style="direction:ltr;text-align:left;color:#FFB45E"></ul>'
          : '<p>كل الملفات موجودة. غالباً هناك نسخة قديمة محفوظة في المتصفح — اضغطي الزر ليتم مسحها وإعادة التحميل.</p>') +
        '<pre id="kkerr" style="direction:ltr;text-align:left;white-space:pre-wrap;color:#ff8a7d"></pre>' +
        '<button onclick="kkReset()" style="padding:14px 22px;border:0;border-radius:14px;background:#FF7A00;color:#fff;font-weight:800;font-size:16px">مسح الكاش وإعادة التحميل</button></div>';
      var ul = document.getElementById('kkm');
      if (ul) m.forEach(function (x) { var li = document.createElement('li'); li.textContent = x; ul.appendChild(li); });
      document.getElementById('kkerr').textContent = lastErr;
    });
  }, 3500);
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
