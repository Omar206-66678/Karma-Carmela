<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F5132">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="كارمه كارميلا — نظام إدارة المخزن والمبيعات يعمل بدون إنترنت">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>كارمه كارميلا</title>
<script>try{var t=localStorage.getItem('kk-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style id="pageStyle"></style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="kkG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FA971"/><stop offset="1" stop-color="#0A3A25"/></linearGradient>
<linearGradient id="kkO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB45E"/><stop offset="1" stop-color="#FF7A00"/></linearGradient>
</defs></svg>
<div id="app"></div>
<div id="sheet"></div><div id="toast"></div><div id="printArea"></div>
<noscript><p style="padding:24px;text-align:center">يلزم تفعيل JavaScript لتشغيل التطبيق.</p></noscript>
<script>
(function () {
  function showFatalError(title, err) {
    var app = document.getElementById('app');
    if (!app) return;
    app.innerHTML =
      '<div style="padding:24px;color:#fff;background:#0B130F;min-height:100vh;font-family:system-ui,sans-serif;line-height:1.8">' +
      '<h2 style="margin:0 0 8px;color:#FF7A00">' + title + '</h2>' +
      '<pre style="direction:ltr;text-align:left;white-space:pre-wrap;color:#ff8a7d;background:#14211A;padding:12px;border-radius:12px;font-size:13px">' +
      String((err && (err.stack || err.message)) || err) + '</pre>' +
      '<button onclick="location.reload(true)" style="margin-top:12px;padding:12px 20px;border:0;border-radius:12px;background:#1FA971;color:#fff;font-weight:700;font-size:15px">إعادة التحميل</button>' +
      '</div>';
  }

  // التقاط أي خطأ عام أثناء التشغيل
  addEventListener('error', function (e) {
    showFatalError('خطأ برمجي في التطبيق', e.message + ' (' + (e.filename || '') + ':' + (e.lineno || '') + ')');
  });
  
  addEventListener('unhandledrejection', function (e) {
    showFatalError('خطأ غير معالج (Promise Rejection)', e.reason);
  });

  // تنظيف الـ Service Worker القديم في الخلفية بأمان تام
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function (ks) {
        ks.forEach(function (k) { caches.delete(k); });
      });
    }
  } catch (e) {}

  // تحميل وتشغيل ملف التطبيق الرئيسي مباشرة
  import('./js/app.js').catch(function (err) {
    showFatalError('تعذّر استيراد ملف app.js', err);
  });
})();
</script>
</body>
</html>
