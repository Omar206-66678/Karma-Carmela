<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار التشغيل</title>
</head>
<body style="background:#0B130F;color:#fff;font-family:sans-serif;padding:30px;text-align:center;">
  <h1>جاري فحص التشغيل...</h1>
  <div id="status" style="margin-top:20px;color:#FF7A00;font-size:18px;"></div>

<script>
  try {
    document.getElementById('status').textContent = 'جاري استدعاء ملفات التطبيق...';
    import('./js/app.js').then(function() {
      document.getElementById('status').textContent = 'تم تحميل app.js بنجاح!';
    }).catch(function(err) {
      document.getElementById('status').innerHTML = '<span style="color:#ff8a7d">خطأ في import: ' + err.message + '</span>';
    });
  } catch (e) {
    document.getElementById('status').innerHTML = '<span style="color:#ff8a7d">خطأ عام: ' + e.message + '</span>';
  }
</script>
</body>
</html>
